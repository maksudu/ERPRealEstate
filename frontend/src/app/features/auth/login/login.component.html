<div
  class="min-h-screen w-full relative flex flex-col justify-between items-center bg-[#f8fbfe] overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <!-- Panoramic Skyline Background Layer (Matches uploaded design) -->
  <div class="absolute inset-0 w-full h-full pointer-events-none bg-no-repeat bg-cover bg-center"
       style="background-image: url('assets/images/auth/login_canvas_bg.png'); background-position: center top;">
  </div>

  <!-- Top Branding: RealBiz ERP Logo with Subtle Horizontal Accent Lines -->
  <header class="relative z-10 w-full pt-6 sm:pt-8 md:pt-10 flex items-center justify-center gap-4 sm:gap-6 px-4">
    <div class="hidden sm:block h-[1px] w-16 sm:w-28 md:w-40 bg-slate-300/70"></div>
    <div class="flex flex-col items-center">
      <img src="assets/images/auth/realbiz_erp_logo_clean.png"
           alt="RealBiz ERP - A Cloud-Based Real Estate Management Platform"
           class="h-12 sm:h-16 md:h-20 w-auto object-contain select-none" />
    </div>
    <div class="hidden sm:block h-[1px] w-16 sm:w-28 md:w-40 bg-slate-300/70"></div>
  </header>

  <!-- Center Floating Login Card -->
  <main class="relative z-10 w-full max-w-[430px] mx-auto px-4 my-auto py-4">
    <div class="bg-white rounded-2xl shadow-2xl shadow-blue-900/10 border border-slate-100/90 px-8 py-7 sm:px-9 sm:py-8 transition-all">
      
      <!-- Card Header: Blue Lock Icon + Title -->
      <div class="flex items-center justify-center gap-2 mb-6 text-[#1e293b]">
        <svg class="w-5 h-5 text-[#0062cc] fill-current" viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
        </svg>
        <h2 class="text-xl font-bold tracking-tight text-[#1e293b]">Please Login</h2>
      </div>

      <!-- Inactivity Timeout Banner -->
      <div *ngIf="idleNotice()"
           class="mb-4 p-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-xs flex items-center gap-2 animate-fadeIn">
        <svg class="w-4 h-4 flex-shrink-0 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ idleNotice() }}</span>
      </div>

      <!-- Feedback / Error Alert -->
      <div *ngIf="errorMessage()"
           class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-xs flex items-center gap-2 animate-fadeIn">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- Form Inputs -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email / Username Input -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <input type="text"
                 formControlName="username"
                 placeholder="Email address"
                 autocomplete="username"
                 class="w-full pl-11 pr-4 py-2.5 text-sm bg-white border border-slate-300 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#0062cc] focus:ring-2 focus:ring-[#0062cc]/20 transition-all" />
        </div>

        <!-- Password Input -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input [type]="showPassword() ? 'text' : 'password'"
                 formControlName="password"
                 placeholder="Password"
                 autocomplete="current-password"
                 class="w-full pl-11 pr-11 py-2.5 text-sm bg-white border border-slate-300 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#0062cc] focus:ring-2 focus:ring-[#0062cc]/20 transition-all" />
          
          <button type="button"
                  (click)="toggleShowPassword()"
                  class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
                  title="Toggle password visibility">
            <!-- Eye Off (Password hidden) -->
            <svg *ngIf="!showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
            <!-- Eye (Password visible) -->
            <svg *ngIf="showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>

        <!-- Remember Me & Forgot Password Row -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox"
                   formControlName="rememberMe"
                   class="w-4 h-4 rounded text-[#0062cc] border-slate-300 focus:ring-[#0062cc] accent-[#0062cc] cursor-pointer" />
            <span class="text-xs font-medium text-slate-600">Remember me</span>
          </label>
          <a href="javascript:void(0)" class="text-xs font-medium text-[#1e70e3] hover:underline hover:text-blue-700 transition-colors">
            Forgot password?
          </a>
        </div>

        <!-- Submit Button: Royal Blue with Sign In Arrow Icon -->
        <button type="submit"
                [disabled]="isLoading()"
                class="w-full mt-2 py-2.5 px-4 bg-[#0062cc] hover:bg-[#0051a8] active:bg-[#00448f] text-white font-semibold text-sm rounded-lg shadow-md shadow-blue-600/25 flex items-center justify-center gap-2 transition-all duration-150 active:scale-[0.99] disabled:opacity-70 disabled:cursor-not-allowed">
          <!-- Sign In Arrow Door Icon -->
          <svg *ngIf="!isLoading()" class="w-4 h-4 fill-current" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
                  d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z"
                  clip-rule="evenodd" />
          </svg>
          <!-- Loading Spinner -->
          <svg *ngIf="isLoading()" class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>{{ isLoading() ? 'Signing In...' : 'Sign In' }}</span>
        </button>
      </form>
    </div>

    <!-- Quick Access Demo Badges (Subtle 1-click test pills) -->
    <div class="mt-4 flex items-center justify-center gap-2">
      <button type="button"
              (click)="quickFill('admin', 'AdminPassword123!', true)"
              class="px-3 py-1 text-[11px] font-medium text-slate-500 bg-white/80 hover:bg-white hover:text-[#0062cc] border border-slate-200/80 rounded-full shadow-xs transition-all backdrop-blur-xs cursor-pointer">
        ⚡ Demo Admin
      </button>
      <button type="button"
              (click)="quickFill('engineer_kamal', 'EngineerPass123!', true)"
              class="px-3 py-1 text-[11px] font-medium text-slate-500 bg-white/80 hover:bg-white hover:text-[#0062cc] border border-slate-200/80 rounded-full shadow-xs transition-all backdrop-blur-xs cursor-pointer">
        ⚡ Site Engineer
      </button>
    </div>
  </main>

  <!-- Clean Bottom Footer -->
  <footer class="relative z-10 w-full py-4 text-center text-xs text-slate-400 select-none">
    <span>RealBiz ERP &copy; 2026. A Cloud-Based Real Estate Management Platform.</span>
  </footer>
</div>
