<div class="p-4 sm:p-6 w-full max-w-5xl mx-auto space-y-6">
  <div class="flex items-center justify-between pb-2">
    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="goBack()"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-2xs"
      >
        <span aria-hidden="true">&larr;</span> Back to conversions
      </button>
      <span class="text-xs px-2.5 py-0.5 rounded-full font-medium bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800">
        Land records · Measurement reference
      </span>
    </div>
  </div>

  @if (loadError()) {
  <div role="alert" class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-200">
    {{ loadError() }}
  </div>
  }

  @if (saveError()) {
  <div role="alert" class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-200">
    {{ saveError() }}
  </div>
  }

  <app-card-container
    [hasHeader]="true"
    [title]="isEditMode ? 'Edit regional convention' : 'Create regional convention'"
    [subtitle]="'Define the measurement ratios used by the live area converter.'"
    [badge]="isEditMode ? 'Edit Mode' : 'New Convention'"
  >
    @if (isLoading()) {
    <div class="py-16 text-center text-sm text-slate-500" role="status">Loading convention details…</div>
    } @else if (!loadError()) {
    <form [formGroup]="conventionForm" (ngSubmit)="saveConvention()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <app-custom-input label="Convention Code *" formControlName="convention_code"
          placeholder="e.g. BARISAL_COASTAL" [required]="true"></app-custom-input>
        <app-custom-input label="Convention Name *" formControlName="convention_name"
          placeholder="e.g. Barisal Division Land Convention" [required]="true"></app-custom-input>
        <app-searchable-select categoryCode="MEASUREMENT_REGIONS" label="Region / District *"
          formControlName="region_district" [allowCreateNew]="true"
          placeholder="Select or add region..."></app-searchable-select>
      </div>

      <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-850/50 p-4 space-y-3">
        <h2 class="text-sm font-bold text-slate-900 dark:text-slate-100">Conversion ratios</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
          <app-custom-input label="1 Katha in Sq Ft *" formControlName="katha_to_sqft" type="number" step="0.01"
            placeholder="720.00" [required]="true"></app-custom-input>
          <app-custom-input label="1 Decimal in Sq Ft *" formControlName="decimal_to_sqft" type="number" step="0.01"
            placeholder="435.60" [required]="true"></app-custom-input>
          <app-custom-input label="1 Bigha in Katha *" formControlName="bigha_to_katha" type="number" step="0.01"
            placeholder="20.00" [required]="true"></app-custom-input>
          <app-custom-input label="1 Acre in Decimal *" formControlName="acre_to_decimal" type="number" step="0.01"
            placeholder="100.00" [required]="true"></app-custom-input>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <app-custom-input label="1 Kani in Sq Ft (Optional)" formControlName="kani_to_sqft" type="number"
            step="0.01" placeholder="17280.00"></app-custom-input>
          <app-custom-input label="1 Gonda in Sq Ft (Optional)" formControlName="gonda_to_sqft" type="number"
            step="0.01" placeholder="864.00"></app-custom-input>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-[1fr_auto] gap-4 items-end">
        <app-custom-textarea label="Historical legal notes" formControlName="notes"
          placeholder="Local survey or deed-practice context..." [rows]="2"></app-custom-textarea>
        <label class="flex items-center gap-2 cursor-pointer pb-2">
          <input type="checkbox" formControlName="is_default"
            class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300 dark:border-slate-700" />
          <span class="text-xs font-semibold text-slate-800 dark:text-slate-200">Set as default convention</span>
        </label>
      </div>

      <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 border-t border-slate-200 dark:border-slate-800 pt-4">
        <button type="button" (click)="goBack()" [disabled]="isSaving()"
          class="px-4 py-2 text-sm font-semibold rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50">
          Cancel
        </button>
        <button type="submit" [disabled]="isSaving() || isLoading()"
          class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white disabled:opacity-50">
          @if (isSaving()) { Saving… } @else { {{ isEditMode ? 'Update convention' : 'Save convention' }} }
        </button>
      </div>
    </form>
    }
  </app-card-container>
</div>
