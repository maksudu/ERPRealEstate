<div class="mx-auto w-full max-w-5xl space-y-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold text-slate-900 dark:text-white">{{ pageTitle }}</h1>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ pageSubtitle }}</p>
    </div>
    <button type="button" (click)="goBack()" class="rounded-lg border border-slate-300 px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800">
      Back to Valuation & Costing
    </button>
  </div>

  <div *ngIf="errorMessage" class="flex items-start justify-between gap-3 rounded-lg border border-rose-300 bg-rose-50 px-4 py-3 text-xs text-rose-800 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-300" role="alert">
    <span>{{ errorMessage }}</span>
    <button type="button" (click)="errorMessage = ''" aria-label="Dismiss error" class="font-bold">×</button>
  </div>

  <app-card-container [hasHeader]="true" [title]="pageTitle" [subtitle]="pageSubtitle" [badge]="isEditMode ? 'Edit Record' : 'New Record'">
    <div *ngIf="isLoading" class="py-12 text-center text-xs text-slate-500" role="status">
      <i class="fas fa-circle-notch fa-spin mr-2"></i>Loading record...
    </div>

    <div *ngIf="!isLoading && recordType === 'costing'" class="space-y-5">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Target Land Parcel <span class="text-rose-500">*</span></label>
          <app-searchable-select [options]="parcelOptions" placeholder="Select target parcel..." [(ngModel)]="costingData.parcel_id"></app-searchable-select>
        </div>
        <app-custom-input label="Costing & Budget Date" type="date" [(ngModel)]="costingData.costing_date" [required]="true"></app-custom-input>
        <app-custom-input label="Agreed Land Purchase Price (BDT)" type="number" [(ngModel)]="costingData.agreed_purchase_price_bdt" placeholder="0"></app-custom-input>
        <app-custom-input label="Total Budget Allocated (BDT)" type="number" [(ngModel)]="costingData.budget_allocated_bdt" placeholder="0"></app-custom-input>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Linked Valuation (Optional)</label>
          <app-searchable-select [options]="valuationOptions" placeholder="Select valuation..." [(ngModel)]="costingData.valuation_id" [allowCreateNew]="false"></app-searchable-select>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Costing Status</label>
          <app-searchable-select categoryCode="COSTING_STATUS" placeholder="Select status..." [(ngModel)]="costingData.costing_status" [allowCreateNew]="true"></app-searchable-select>
        </div>
      </div>
      <app-custom-textarea label="Acquisition Budget Remarks & Board Directives" [(ngModel)]="costingData.remarks" [rows]="4" placeholder="Payment milestones, escrow arrangements, or banking source..."></app-custom-textarea>
    </div>

    <div *ngIf="!isLoading && recordType === 'valuation'" class="space-y-5">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Target Land Parcel <span class="text-rose-500">*</span></label>
          <app-searchable-select [options]="parcelOptions" placeholder="Select target parcel..." [(ngModel)]="valuationData.parcel_id" (ngModelChange)="updateGovernmentValuation()"></app-searchable-select>
        </div>
        <app-custom-input label="Valuation Date" type="date" [(ngModel)]="valuationData.valuation_date" [required]="true"></app-custom-input>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Valuation Source</label>
          <app-searchable-select categoryCode="VALUATION_SOURCE" placeholder="Select valuation source..." [(ngModel)]="valuationData.valuation_source" [allowCreateNew]="true"></app-searchable-select>
        </div>
        <app-custom-input label="Assessor / Valuer Name" [(ngModel)]="valuationData.assessor_name" placeholder="Enter assessor name" [required]="true"></app-custom-input>
        <app-custom-input label="Survey / Valuation Company" [(ngModel)]="valuationData.assessor_company" placeholder="Company name"></app-custom-input>
        <app-custom-input label="Valuer Professional License No" [(ngModel)]="valuationData.assessor_license_no" placeholder="License number"></app-custom-input>
        <app-custom-input label="Landowner Asking Price (BDT)" type="number" [(ngModel)]="valuationData.asking_price_total_bdt" placeholder="0"></app-custom-input>
        <app-custom-input label="Assessed Market Valuation (BDT)" type="number" [(ngModel)]="valuationData.market_valuation_total_bdt" placeholder="0"></app-custom-input>
        <app-custom-input label="Govt Mouza Rate / Decimal (BDT)" type="number" [(ngModel)]="valuationData.govt_mouza_rate_per_decimal_bdt" (ngModelChange)="updateGovernmentValuation()" placeholder="0"></app-custom-input>
        <app-custom-input label="Govt Mouza Valuation Total (BDT)" type="number" [(ngModel)]="valuationData.govt_mouza_valuation_total_bdt" placeholder="0"></app-custom-input>
        <app-custom-input label="Recommended Offer Price (BDT)" type="number" [(ngModel)]="valuationData.recommended_offer_price_bdt" placeholder="0"></app-custom-input>
      </div>
      <app-custom-textarea label="Valuation Methodology & Comparable Sales Evidence" [(ngModel)]="valuationData.notes_and_methodology" [rows]="4" placeholder="Comparable transactions, frontage adjustments, or registry circle rates..."></app-custom-textarea>
    </div>

    <div *ngIf="!isLoading" class="mt-6 flex justify-end gap-3 border-t border-slate-200 pt-4 dark:border-slate-800">
      <button type="button" (click)="goBack()" class="rounded-lg border border-slate-300 px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800">Cancel</button>
      <button type="button" (click)="save()" [disabled]="isSaving || !recordLoaded || !parcels.length" class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-4 py-2 text-xs font-semibold text-white hover:bg-primary-700 disabled:opacity-50">
        <i class="fas" [ngClass]="isSaving ? 'fa-circle-notch fa-spin' : 'fa-save'"></i>
        {{ isSaving ? 'Saving...' : (isEditMode ? 'Update Record' : 'Save Record') }}
      </button>
    </div>
  </app-card-container>
</div>
