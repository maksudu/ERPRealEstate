@if (isAuthPage()) {
  <router-outlet></router-outlet>
} @else {
  <div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col font-sans transition-colors duration-200">
    <!-- Enterprise Top Navigation Bar Component -->
    <app-topbar (toggleSidebar)="toggleSidebar()" class="sticky top-0 z-40 block w-full bg-white dark:bg-slate-900 shadow-xs"></app-topbar>

    <!-- Main Full-Screen Body Layout with Fluid Width & Responsive Spacing -->
    <div class="flex-1 flex p-2 sm:p-4 lg:p-6 gap-4 lg:gap-6 w-full items-start">
      <!-- Multi-Level Collapsible Sidebar with Nested Sub-menus & Real-Time Filter -->
      @if (isSidebarOpen()) {
        <!-- Desktop in-flow sticky full-height sidebar -->
        <app-sidebar class="shrink-0 sticky top-20 self-start hidden lg:block"></app-sidebar>

        <!-- Mobile drawer overlay with backdrop -->
        <div class="fixed inset-0 z-50 lg:hidden bg-slate-900/60 backdrop-blur-xs flex" (click)="toggleSidebar()">
          <div class="p-3 w-80 max-w-[85vw] h-full" (click)="$event.stopPropagation()">
            <app-sidebar class="block h-full"></app-sidebar>
          </div>
        </div>
      }

      <!-- Central Full-Screen Workspace -->
      <main class="flex-1 min-w-0 w-full relative z-10">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
}

<!-- Idle Inactivity Warning Dialog -->
@if (idleTracker.isWarningModalOpen()) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 max-w-md w-full p-6 text-center transform transition-all">
      <!-- Icon with animated pulse -->
      <div class="mx-auto w-16 h-16 rounded-full bg-amber-50 dark:bg-amber-950/40 border-2 border-amber-500/30 flex items-center justify-center mb-4 relative">
        <div class="absolute inset-0 rounded-full animate-ping bg-amber-400/20"></div>
        <svg class="w-8 h-8 text-amber-500 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">
        Session Expiring Soon
      </h3>

      <p class="text-sm text-slate-600 dark:text-slate-400 mb-5">
        You have been inactive for a while. To protect financial and enterprise data, your session will automatically terminate in:
      </p>

      <!-- Live countdown display -->
      <div class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 font-mono font-bold text-2xl mb-6">
        {{ idleTracker.countdownSeconds() }}s
      </div>

      <!-- Action buttons -->
      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="idleTracker.logoutNow()"
          class="flex-1 py-2.5 px-4 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium text-sm transition-colors">
          Log Out Now
        </button>
        <button
          type="button"
          (click)="idleTracker.stayLoggedIn()"
          class="flex-1 py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-1.5">
          <span>Stay Logged In</span>
        </button>
      </div>
    </div>
  </div>
}
