<div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col font-sans transition-colors duration-200">
  <!-- Enterprise Top Navigation Bar Component -->
  <app-topbar (toggleSidebar)="toggleSidebar()"></app-topbar>

  <!-- Main Body Layout with Proportional Equal Gap (p-6 gap-6) -->
  <div class="flex-1 flex p-6 gap-6 max-w-[1700px] w-full mx-auto">
    <!-- Multi-Level Collapsible Sidebar with Nested Sub-menus & Real-Time Filter -->
    @if (isSidebarOpen()) {
      <app-sidebar></app-sidebar>
    }

    <!-- Central Workspace: Renders completely inside unified Card Container -->
    <main class="flex-1 min-w-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
